<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Çalışmalar - ArticleSumm</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="js/script.js" defer></script>
</head>
<body class="history-page-body">
    <div class="history-shell">
        <header class="history-hero card">
            <div>
                <p class="eyebrow">Geçmiş</p>
                <h1>Çalışmalarınız</h1>
                <p class="history-lead">Her çalışma altında birden fazla özeti bir arada saklayın, sonra tekrar açıp devam edin.</p>
            </div>
            <a class="secondary-link" href="summary.html">+ Yeni özet oluştur</a>
        </header>

        <section class="history-layout">
            <aside class="card workspace-sidebar-card">
                <div class="card-header-row">
                    <h2>Çalışmalar</h2>
                </div>

                <form id="create-workspace-form" class="workspace-create-form">
                    <input id="workspace-title-input" class="modal-input" type="text" placeholder="Örn. Makale 1 / Tez / Proje" required>
                    <button type="submit" class="primary-btn small-btn">Çalışma Oluştur</button>
                </form>

                <div id="workspace-history-list" class="workspace-chip-list"></div>
            </aside>

            <main class="card workspace-detail-card">
                <div class="card-header-row">
                    <div>
                        <h2 id="workspace-detail-title">Çalışma seçin</h2>
                        <p id="workspace-detail-meta" class="muted-text"></p>
                    </div>
                </div>
                <div id="workspace-summary-list" class="workspace-summary-grid"></div>
                <p id="workspace-empty-state" class="empty-state" style="display:none;">Bu çalışma altında henüz özet yok.</p>
            </main>
        </section>
    </div>
</body>
</html>
