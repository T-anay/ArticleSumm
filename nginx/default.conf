server {
    listen 80;
    server_name localhost;
    client_max_body_size 30m;

    # 1. API Rotaları için Proxy
    location /api/ {
        proxy_pass http://makale_api:8000; # doğru container adı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # 2. Backend health endpoint'i aynı origin'den doğrulamak için proxy
    location = /health {
        proxy_pass http://makale_api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Frontend Statik Dosyaları
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
